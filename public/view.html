<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>查看 - 知识库浏览器</title>
  <link rel="stylesheet" href="/vendor/github-markdown-css/github-markdown-light.css">
  <link rel="stylesheet" href="/vendor/highlight/styles/github.min.css">
  <style>
    body { margin: 0; padding: 24px 32px 64px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .path { color: #666; font-size: 13px; word-break: break-all; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 16px; }
    .markdown-body { max-width: 920px; margin: 0 auto; }
    .markdown-body pre { overflow-x: auto; }
    .error { color: #b23a48; }
  </style>
</head>
<body>
  <div class="path" id="path-label"></div>
  <article class="markdown-body" id="content">加载中…</article>
  <script src="/vendor/marked/marked.umd.js"></script>
  <script src="/vendor/dompurify/purify.min.js"></script>
  <script src="/vendor/highlight/highlight.min.js"></script>
  <script>
    /* global marked, hljs, DOMPurify */
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const path = params.get('path');
    const label = document.getElementById('path-label');
    const content = document.getElementById('content');
    label.textContent = `${id} / ${path}`;
    document.title = `${path} - 知识库浏览器`;

    const SANITIZE_OPTIONS = { ADD_TAGS: ['input'], ADD_ATTR: ['type', 'checked', 'disabled'] };

    const rawUrl = relPath => `/api/repos/${encodeURIComponent(id)}/raw?path=${encodeURIComponent(relPath)}`;

    // 相对路径的图片/链接改写到 raw 接口（以 md 文件所在目录为基准），与 GitHub 行为一致
    function resolveMedia(container, relPath) {
      const baseDir = relPath.split('/').slice(0, -1).join('/');
      const resolveRel = url => {
        if (!url || /^(https?:)?\/\//.test(url) || url.startsWith('data:') || url.startsWith('#') || url.startsWith('/')) return null;
        const out = [];
        for (const p of (baseDir ? `${baseDir}/${url}` : url).split('/')) {
          if (p === '' || p === '.') continue;
          else if (p === '..') out.pop();
          else out.push(p);
        }
        return out.join('/');
      };
      container.querySelectorAll('img').forEach(img => {
        const resolved = resolveRel(img.getAttribute('src'));
        if (resolved) img.src = rawUrl(resolved);
      });
      container.querySelectorAll('a').forEach(a => {
        const resolved = resolveRel(a.getAttribute('href'));
        if (resolved) {
          a.href = rawUrl(resolved);
          a.target = '_blank';
        }
      });
    }

    fetch(`/api/repos/${encodeURIComponent(id)}/file?path=${encodeURIComponent(path)}`)
      .then(async res => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `加载失败 (${res.status})`);
        return data.content;
      })
      .then(md => {
        content.innerHTML = DOMPurify.sanitize(marked.parse(md), SANITIZE_OPTIONS);
        content.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        resolveMedia(content, path);
      })
      .catch(err => {
        content.innerHTML = '';
        content.className = 'error';
        content.textContent = err.message;
      });
  </script>
</body>
</html>
